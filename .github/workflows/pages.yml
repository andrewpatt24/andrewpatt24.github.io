name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check maintenance mode
        id: maintenance
        run: echo "enabled=$([ -f offline/ENABLED ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.maintenance.outputs.enabled != 'true'
        with:
          node-version: "20"
          cache: npm

      - uses: ruby/setup-ruby@v1
        if: steps.maintenance.outputs.enabled != 'true'
        with:
          ruby-version: "3.2"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/site/Gemfile

      - name: Build site or publish maintenance page
        run: |
          mkdir -p site/_site
          if [ -f offline/ENABLED ]; then
            cp offline/index.html site/_site/index.html
          else
            npm ci
            npm run jekyll:install
            npm run build
          fi

      - name: Verify build output
        run: test -f site/_site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
